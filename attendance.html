<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>勤怠表</title>
  <link rel="stylesheet" href="css/style.css?v=20260704-17" />
</head>
<body class="attendance-page">
  <header>
    <div class="header-text">
      <h1>勤怠表</h1>
      <div class="sub">前月1日から今月末日までの出勤、退勤、休憩、勤務、残業を日付ごとに表示します。</div>
    </div>
    <div class="header-actions">
      <a class="link-button secondary" href="index.html">日報生成へ</a>
    </div>
  </header>

  <main class="single-main">
    <section class="result attendance-panel">
      <div class="result-head">
        <h2 class="result-title">前月1日から今月末日までの勤怠</h2>
        <div class="attendance-summary" id="attendanceSummary"></div>
      </div>

      <div class="attendance-table-wrap">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>日付（曜日）</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>休憩</th>
              <th>勤務</th>
              <th>残業</th>
              <th>削除</th>
            </tr>
          </thead>
          <tbody id="attendanceRows">
            <tr><td colspan="7">勤怠データを読み込み中です。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/attendance.js?v=20260704-13"></script>
</body>
</html>
